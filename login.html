<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 多项目管理系统 PMM</title>
    <!-- 引入 Google 字体与 FontAwesome 图标库 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #1677ff;
            --primary-hover: #4096ff;
            --bg-dark: #0a192f;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --card-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
            background-color: #f8fafc;
            color: var(--text-main);
        }

        /* 页面整体两栏布局 */
        .container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* ================= 左侧品牌与展示区 ================= */
        .brand-section {
            flex: 1.1;
            background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #0d1b2a 100%);
            color: #ffffff;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        /* 装饰性背景图形 */
        .brand-section::before {
            content: '';
            position: absolute;
            top: -20%;
            right: -20%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(22, 119, 255, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--primary-color);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            box-shadow: 0 4px 12px rgba(22, 119, 255, 0.4);
        }

        .brand-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .brand-content {
            z-index: 2;
            max-width: 520px;
            margin: auto 0;
        }

        .brand-content h1 {
            font-size: 38px;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 20px;
            background: linear-gradient(to right, #ffffff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-content p {
            font-size: 16px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        /* 业务卡片展示 */
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
        }

        .stat-card .icon {
            font-size: 18px;
            margin-bottom: 10px;
            color: #60a5fa;
        }

        .stat-card .value {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .stat-card .label {
            font-size: 13px;
            color: #94a3b8;
        }

        .brand-footer {
            z-index: 2;
            font-size: 13px;
            color: #64748b;
        }

        /* ================= 右侧登录表单区 ================= */
        .form-section {
            flex: 0.9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background-color: #ffffff;
        }

        .login-wrapper {
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            margin-bottom: 32px;
        }

        .login-header h2 {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #334155;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-container i {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            font-size: 15px;
            transition: color 0.3s;
        }

        .input-container input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }

        .input-container input:focus {
            border-color: var(--primary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(22, 119, 255, 0.1);
        }

        .input-container input:focus + i {
            color: var(--primary-color);
        }

        .form-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #475569;
            cursor: pointer;
        }

        .remember-me input {
            accent-color: var(--primary-color);
            width: 16px;
            height: 16px;
        }

        .forgot-password {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        /* 第三方登录 */
        .divider {
            display: flex;
            align-items: center;
            margin: 28px 0;
            color: #94a3b8;
            font-size: 12px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: var(--border-color);
        }

        .divider span {
            padding: 0 12px;
        }

        .sso-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .sso-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #ffffff;
            color: #334155;
            font-size: 13px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .sso-btn:hover {
            background-color: #f8fafc;
            border-color: #cbd5e1;
        }

        /* 响应式适配 */
        @media (max-width: 900px) {
            .brand-section {
                display: none;
            }
            .form-section {
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 左侧品牌与展示区 -->
        <div class="brand-section">
            <div class="brand-header">
                <div class="logo-icon">
                    <i class="fa-solid fa-diagram-project"></i>
                </div>
                <span class="brand-title">PMM 协同管理平台</span>
            </div>

            <div class="brand-content">
                <h1>全局掌控多项目<br>精准把控风险与进度</h1>
                <p>集中化管理所有跨部门项目，实时识别潜在风险，让团队交付更高效、更透明。</p>
                
                <div class="stats-cards">
                    <div class="stat-card">
                        <div class="icon"><i class="fa-solid fa-list-check"></i></div>
                        <div class="value">100%</div>
                        <div class="label">项目进度透明化</div>
                    </div>
                    <div class="stat-card">
                        <div class="icon" style="color: #f59e0b;"><i class="fa-solid fa-triangle-exclamation"></i></div>
                        <div class="value">智能识别</div>
                        <div class="label">实时风险预警</div>
                    </div>
                </div>
            </div>

            <div class="brand-footer">
                &copy; 2026 PMM System. 保留所有权利。
            </div>
        </div>

        <!-- 右侧登录表单区 -->
        <div class="form-section">
            <div class="login-wrapper">
                <div class="login-header">
                    <h2>欢迎回来</h2>
                    <p>请输入您的账号信息以登录系统</p>
                </div>

                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="username">用户名：</label>
                        <div class="input-container">
                            <input type="text" id="username" placeholder="请输入您的账号或邮箱" required>
                            <i class="fa-regular fa-user"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">登录密码</label>
                        <div class="input-container">
                            <input type="password" id="password" placeholder="请输入密码" required>
                            <i class="fa-solid fa-lock"></i>
                        </div>
                    </div>

                    <div class="form-actions">
                        <label class="remember-me">
                            <input type="checkbox" id="remember">
                            <span>记住账号</span>
                        </label>
                        <a href="#" class="forgot-password">忘记密码？</a>
                    </div>

                    <button type="submit" class="btn-submit">立 即 登 录</button>
                </form>

                <div class="divider">
                    <span>或使用企业单点登录 (SSO)</span>
                </div>

                <div class="sso-options">
                    <button class="sso-btn">
                        <i class="fa-solid fa-building-user" style="color: #0089ff;"></i>
                        企业微信
                    </button>
                    <button class="sso-btn">
                        <i class="fa-solid fa-paper-plane" style="color: #00d6b9;"></i>
                        飞书
                    </button>
                    <button class="sso-btn">
                        <i class="fa-solid fa-bolt" style="color: #007fff;"></i>
                        钉钉
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            alert(`登录成功！欢迎回来，${username}`);
        }
    </script>
</body>
</html>
